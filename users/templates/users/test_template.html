<style>
  #action-slide .slide-message {
    min-width: 260px;
    max-width: 420px;
    padding: 1.2rem 2.2rem;
    font-size: 1.35rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(90deg, rgba(30,41,59,0.85) 0%, rgba(255,140,0,0.15) 50%, rgba(30,41,59,0.85) 100%);
    border-radius: 1.5rem;
    box-shadow: 0 8px 32px 0 rgba(255,140,0,0.18);
    border: 2px solid #f59e42;
    text-align: center;
    letter-spacing: 0.03em;
    opacity: 0;
    transform: translateY(-40px) scale(0.98);
    transition: all 0.7s cubic-bezier(.4,0,.2,1);
    backdrop-filter: blur(4px);
    position: relative;
  }
  #action-slide .slide-message.slide-in {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  #action-slide .slide-message.slide-out {
    opacity: 0;
    transform: translateY(40px) scale(0.98);
    transition: all 0.5s cubic-bezier(.4,0,.2,1);
  }
  /* Optional: glowing edge effect */
  #action-slide .slide-message::before, #action-slide .slide-message::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 32px;
    pointer-events: none;
    z-index: 1;
  }
  #action-slide .slide-message::before {
    left: 0;
    background: linear-gradient(90deg, rgba(255,140,0,0.18) 0%, transparent 100%);
    border-radius: 1.5rem 0 0 1.5rem;
  }
  #action-slide .slide-message::after {
    right: 0;
    background: linear-gradient(270deg, rgba(255,140,0,0.18) 0%, transparent 100%);
    border-radius: 0 1.5rem 1.5rem 0;
  }
</style>

<script>
/**
 * Slides in a battle action message, then fades out.
 * @param {string} message - The action text to display.
 * @param {number} [duration=1800] - How long to show before fading out (ms).
 */
function showActionSlide(message, duration = 1800) {
  const overlay = document.getElementById('action-slide-overlay');
  overlay.classList.remove('hidden')
  const container = document.getElementById('action-slide');
  // Remove any previous message
  container.innerHTML = '';
  // Create message element
  const msg = document.createElement('div');
  msg.className = 'slide-message';
  msg.textContent = message;
  container.appendChild(msg);

  const sound = document.getElementById("sword-sound")
  console.log(sound)
  sound.play();
  console.log("swording...")
  // Animate in
  setTimeout(() => msg.classList.add('slide-in'), 10);
  // Animate out after duration
  setTimeout(() => {
    msg.classList.remove('slide-in');
    msg.classList.add('slide-out');
    //overlay.classList.add('hidden')
    setTimeout(() => {
      if (msg.parentNode) msg.parentNode.removeChild(msg);
      overlay.classList.add('hidden')
    }, 600);
  }, duration);
}

// Action Slide Queue System
const actionSlideQueue = [];
let actionSlideActive = false;

/**
 * Queue a message to be shown in the action slide.
 * @param {string} message
 * @param {number} [duration=1800]
 */
function queueActionSlide(message, duration = 1800) {
  actionSlideQueue.push({ message, duration });
  processActionSlideQueue();
}

/**
 * Internal function to process the queue.
 */
function processActionSlideQueue() {
  if (actionSlideActive || actionSlideQueue.length === 0) return;
  actionSlideActive = true;
  const { message, duration } = actionSlideQueue.shift();
  showActionSlide(message, duration);
  setTimeout(() => {
    actionSlideActive = false;
    processActionSlideQueue();
  }, duration + 700); // Wait for fade out transition
}
