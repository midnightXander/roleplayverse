<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Création de Personnage - RPV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function updatePreview(imgSrc) {
      document.getElementById('characterPreview').src = imgSrc;
    }
    function confirmCreation(e) {
      e.preventDefault();
      e.target.submit();
        // Récupérer les valeurs du formulaire

      const popup = document.getElementById("confirmPopup");
      popup.classList.remove("hidden");
      popup.classList.add("fade-in");
    }
  </script>
  <style>
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.95);}
      to {opacity: 1; transform: scale(1);}
    }
    .fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    .gender-option img {
  filter: grayscale(100%);
  transition: filter 0.3s ease;
}

.gender-option:hover img {
  filter: grayscale(0%);
}
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div class="max-w-xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-orange-500 mb-6 text-center">🎭 Création de ton Ninja</h1>

    <!-- Aperçu -->
    

    <form action="{% url 'adventure:create_character' %}" method="POST" enctype="multipart/form-data" class="space-y-5" onsubmit="confirmCreation(event)">
        {% csrf_token %}
        <div class="text-center mb-6">
            <h2 class="text-sm mb-1">Aperçu de ton personnage</h2>
            <img id="characterPreview" src="https://i.imgur.com/rtpJgEF.jpeg" class="mx-auto mb-4 w-24 h-24 rounded-full border-4 border-orange-500">
            <label class="cursor-pointer inline-flex items-center space-x-2 text-sm text-gray-400 hover:text-orange-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V8.414a2 2 0 00-.586-1.414l-3.414-3.414A2 2 0 0012.586 3H4zm0 2h8v3a1 1 0 001 1h3v6H4V5z" />
              </svg>
              <span>Choisis ton apparence</span>
              <input type="file" id="characterImageUpload" name="appearance"  accept="image/*" class="hidden">
            </label>
          </div>
      
        <div>
        <label for="name" class="block text-sm font-semibold mb-1">Nom de ton personnage</label>
        <input required type="text" id="name" name="name" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg border border-gray-700 focus:ring-2 focus:ring-orange-500">
      </div>

      <div>
        <label for="nindo" class="block text-sm font-semibold mb-1">Ton Nindo</label>
        <input type="text" id="nindo" name="nindo" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg border border-gray-700">
      </div>

      <div>
        <label for="clan" class="block text-sm font-semibold mb-1">Clan ou Origine</label>
        <select  id="clan" name="clan" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg border border-gray-700">
            <option value="">Aleatoire</option>
            <option value="Uchiha">Uchiha</option>
          <option value="Hyuga">Hyuga</option>
          <option value="Nara">Nara</option>
          <option value="Inuzuka">Inuzuka</option>
          <option>Sans Clan</option>
        </select>
      </div>

      
      <div>
        <label for="element" class="block text-sm font-semibold mb-1">Affinité élémentaire</label>
        <select id="element" name="element" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg border border-gray-700">
          <!-- <option value="" disabled selected>Choisis ton élément</option> -->
          <option value="" >Aleatoire</option>
            <option value="Fire" >Feu 🔥</option>
          <option value="Water" >Eau 💧</option>
          <option value="Wind" >Vent 🌪️</option>
          <option value="Earth" >Terre 🪨</option>
          <option value="Lightning" >Foudre ⚡</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Genre</label>
        <div class="flex justify-center gap-4">
          <!-- Male Option -->
          <div 
            class="gender-option w-24 h-32 flex flex-col items-center justify-center bg-gray-800 text-white rounded-lg border-4 border-transparent hover:border-orange-500 cursor-pointer transition duration-300"
            onclick="selectGender('male')"
            id="gender-male"
          >
            <img src="https://i.imgur.com/rtpJgEF.jpeg" alt="Male" class="w-12 h-12 mb-2">
            <span class="font-semibold">Homme</span>
          </div>
      
          <!-- Female Option -->
          <div 
            class="gender-option w-24 h-32 flex flex-col items-center justify-center bg-gray-800 text-white rounded-lg border-4 border-transparent hover:border-orange-500 cursor-pointer transition duration-300"
            onclick="selectGender('female')"
            id="gender-female"
          >
            <img src="https://i.imgur.com/rtpJgEF.jpeg" alt="Female" class="w-12 h-12 mb-2">
            <span class="font-semibold">Femme</span>
          </div>
      
          <!-- Non-Binary Option -->
          <div 
            class="gender-option w-24 h-32 flex flex-col items-center justify-center bg-gray-800 text-white rounded-lg border-4 border-transparent hover:border-orange-500 cursor-pointer transition duration-300"
            onclick="selectGender('non-binary')"
            id="gender-non-binary"
          >
            <img src="https://i.imgur.com/rtpJgEF.jpeg" alt="Non-Binary" class="w-12 h-12 mb-2">
            <span class="font-semibold">Non-Binaire</span>
          </div>
        </div>
        <input type="hidden" id="genderInput" name="gender" value="">
      </div>

      <!-- <div>
        <label class="block text-sm font-semibold mb-1">Choisis ton apparence</label>
        <div class="flex gap-4 overflow-x-auto pb-2">
          <img src="https://i.imgur.com/rtpJgEF.jpeg" onclick="updatePreview(this.src)" class="w-24 h-24 object-cover rounded-full border-4 border-transparent hover:border-orange-500 cursor-pointer">
          <img src="https://i.imgur.com/rtpJgEF.jpeg" onclick="updatePreview(this.src)" class="w-24 h-24 object-cover rounded-full border-4 border-transparent hover:border-orange-500 cursor-pointer">
          <img src="https://i.imgur.com/rtpJgEF.jpeg" onclick="updatePreview(this.src)" class="w-24 h-24 object-cover rounded-full border-4 border-transparent hover:border-orange-500 cursor-pointer">
        </div>
      </div> -->

      <div class="pt-4 text-center">
        <button type="submit" class="bg-orange-600 hover:bg-orange-700 px-6 py-2 rounded-full text-white font-semibold text-lg">Créer mon personnage</button>
      </div>
    </form>
  </div>

  <!-- Animation de confirmation -->
  <div id="confirmPopup" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50">
    <div class="bg-gray-800 text-center p-6 rounded-xl shadow-xl fade-in max-w-sm">
      <h2 class="text-xl font-bold text-orange-500 mb-4">🎉 Ton ninja est prêt !</h2>
      <p class="text-sm text-gray-300 mb-4">Tu peux maintenant commencer ton aventure dans l'univers shinobi.</p>
      <button onclick="document.getElementById('confirmPopup').classList.add('hidden')" class="mt-2 bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded-full text-white font-semibold">Commencer</button>
    </div>
  </div>

<script>
    function selectGender(gender) {
  // Update the hidden input value
  document.getElementById('genderInput').value = gender;

  // Remove active styles from all gender options
  document.querySelectorAll('.gender-option').forEach(option => {
    option.classList.remove('border-orange-500');
    option.classList.add('border-transparent');
  });



  // Add active style to the selected gender
  const selectedOption = document.getElementById(`gender-${gender}`);
  selectedOption.classList.remove('border-transparent');
  selectedOption.classList.add('border-orange-500');
}

document.getElementById('characterImageUpload').addEventListener('change', (e) => {
const file = e.target.files[0];
if (file) {
    
    const reader = new FileReader();
    reader.onload = function(event) {
        
        const characterPreview = document.getElementById('characterPreview');
        characterPreview.src = event.target.result; // Update the preview image

        //characterPreview.classList.remove('w-24', 'h-24');
        //characterPreview.classList.add('w-48', 'h-48'); // Adjust size if needed
    
        
    };
    reader.readAsDataURL(file);
}
});


</script>
</body>
</html>
